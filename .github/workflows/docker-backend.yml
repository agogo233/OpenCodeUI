name: Build & Push Backend Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.backend'
      - 'docker/backend-entrypoint.sh'
  # schedule:
  #   # 每天自动重建，跟进 opencode 最新版本
  #   - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodeui-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          set -euo pipefail
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          RAW="$(docker buildx imagetools inspect --raw "${REPO}:${{ steps.meta.outputs.version }}")"
          # buildx 推送后 tag 指向 index（含 attestation），需跟随到 linux/amd64 子 manifest 才有镜像 layers。
          if printf '%s' "$RAW" | jq -e '.manifests' >/dev/null; then
            DIGEST="$(printf '%s' "$RAW" \
              | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')"
            RAW="$(docker buildx imagetools inspect --raw "${REPO}@${DIGEST}")"
          fi
          printf '%s' "$RAW" \
            | jq -r '[.layers[].size] | add / 1048576 | round | "\(.) MiB (compressed)"'
