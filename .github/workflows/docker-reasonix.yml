name: Build & Push Reasonix Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.reasonix'
      - 'docker/entrypoint-reasonix.sh'
      - 'docker/reasonix-config.toml'
  workflow_dispatch:

concurrency:
  group: docker-reasonix-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opencodeui-reasonix

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      # 二进制来自自管 fork 的 latest release，仅 linux/amd64
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.reasonix
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 删除旧package
        uses: actions/delete-package-versions@v5
        with:
          package-name: opencodeui-reasonix
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'
